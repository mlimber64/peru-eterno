name: peru_eterno
description: Peru Eterno - Un viaggio attraverso la storia del Perù
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.1
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - assets/images/caral/
    - assets/images/moche/
    - assets/images/tiahuanaco/
    - assets/images/inca/
    - assets/images/conquista/
    - assets/images/virreinato/
    - assets/images/independencia/
