name: peru_eterno
description: Peru Eterno - Un viaggio attraverso la storia del Perù
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.1
  flutter_animate: ^4.5.0
  shared_preferences: ^2.2.2
  http: ^1.2.0
  cached_network_image: ^3.3.0
  url_launcher: ^6.2.0
  smooth_page_indicator: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/peru-eterno.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/i18n/
    - assets/data/
    - assets/images/content/
    - assets/images/content/caral/
    - assets/images/banners/
    - assets/images/timeline/
    - assets/images/historia/
    - assets/images/caral/
    - assets/images/moche/
    - assets/images/tiahuanaco/
    - assets/images/inca/
    - assets/images/conquista/
    - assets/images/virreinato/
    - assets/images/independencia/
